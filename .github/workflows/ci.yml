name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck, lint, build
        run: npm run check
        env:
          # Build-time placeholders only; no database or external service is
          # contacted during the check suite.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci_placeholder
          AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
          APP_URL: http://localhost:3000
          CRON_SECRET: ci-placeholder-cron-secret
          ADMIN_API_KEY: ci-placeholder-admin-key
